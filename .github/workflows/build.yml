name: Build Plugin

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Upload Bukkit artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuhobotReconnect-Bukkit
          path: bukkit/target/HuhobotReconnect-bukkit-*.jar

      - name: Upload Velocity artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuhobotReconnect-Velocity
          path: velocity/target/HuhobotReconnect-velocity-*.jar